name: Release

# Runs when a version tag is pushed, e.g.:
#   git tag v1.3.0
#   git push origin v1.3.0
on:
  push:
    tags:
      - 'v*.*.*'
  # Re-run for an existing tag from the Actions tab.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release, e.g. v1.5.0'
        required: true

permissions:
  contents: read

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  release:
    name: Publish GitHub release
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Build release zip and module
        shell: pwsh
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: ./build.ps1 -Task Package -Tag $env:TAG

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          files=("out/WinPkgScan-$TAG.zip" "out/WinPkgScan-$TAG.zip.sha256")
          if gh release view "$TAG" > /dev/null 2>&1; then
            # A release was already made for this tag (e.g. by hand on GitHub):
            # attach the files and replace its title and notes.
            gh release upload "$TAG" "${files[@]}" --clobber
            gh release edit "$TAG" --title "WinPkgScan $TAG" --notes-file out/release-notes.md --latest
          else
            gh release create "$TAG" "${files[@]}" \
              --title "WinPkgScan $TAG" \
              --notes-file out/release-notes.md \
              --verify-tag --latest
          fi

      # Publishes the module to the PowerShell Gallery. Needs the repository
      # secret PSGALLERY_API_KEY: without it this step is skipped. A version
      # that is already on the Gallery is skipped too, so re-runs are safe.
      - name: Publish to the PowerShell Gallery
        shell: pwsh
        env:
          PSGALLERY_API_KEY: ${{ secrets.PSGALLERY_API_KEY }}
        run: |
          if (-not $env:PSGALLERY_API_KEY) {
            Write-Host '::notice title=PowerShell Gallery::Skipped: add the PSGALLERY_API_KEY repository secret to publish the module.'
            exit 0
          }
          $module  = Join-Path $PWD 'out/module/WinPkgScan'
          $version = (Import-PowerShellDataFile (Join-Path $module 'WinPkgScan.psd1')).ModuleVersion
          if (Find-PSResource -Name WinPkgScan -Version $version -Repository PSGallery -ErrorAction SilentlyContinue) {
            Write-Host "::notice title=PowerShell Gallery::WinPkgScan $version is already published."
            exit 0
          }
          Publish-PSResource -Path $module -Repository PSGallery -ApiKey $env:PSGALLERY_API_KEY -ErrorAction Stop
          Write-Host "Published WinPkgScan $($version): https://www.powershellgallery.com/packages/WinPkgScan/$($version)"
