name: Release

# Runs when a version tag is pushed, e.g.:
#   git tag v1.3.0
#   git push origin v1.3.0
on:
  push:
    tags:
      - 'v*.*.*'
  # Re-run for an existing tag from the Actions tab.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release, e.g. v1.5.0'
        required: true

permissions:
  contents: read

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  release:
    name: Publish GitHub release
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Build release zip
        shell: pwsh
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: ./build.ps1 -Task Package -Tag $env:TAG

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          files=("out/WinPkgScan-$TAG.zip" "out/WinPkgScan-$TAG.zip.sha256")
          if gh release view "$TAG" > /dev/null 2>&1; then
            # A release was already made for this tag (e.g. by hand on GitHub):
            # attach the files and replace its title and notes.
            gh release upload "$TAG" "${files[@]}" --clobber
            gh release edit "$TAG" --title "WinPkgScan $TAG" --notes-file out/release-notes.md --latest
          else
            gh release create "$TAG" "${files[@]}" \
              --title "WinPkgScan $TAG" \
              --notes-file out/release-notes.md \
              --verify-tag --latest
          fi
